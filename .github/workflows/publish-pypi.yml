name: Publish to PyPI

# PREPARATION ONLY. This workflow cannot run on ordinary pushes: it triggers
# only on GitHub Release publication or on explicit manual dispatch into the
# `pypi` environment. DiffSeal has not been published; this file prepares the
# Trusted Publishing (OIDC) flow for a separately governed Community release.
#
# The referenced `pypi` environment is expected to be configured by the owner
# before first use. No API token or other long-lived secret is used.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          pip install build
      - name: Build sdist and wheel
        run: python -m build
      - name: Publish to PyPI (Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
