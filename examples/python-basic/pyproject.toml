[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "python-basic-demo"
version = "0.1.0"
description = "Tiny DiffSeal demonstration package: one function, tests, lint, coverage."
requires-python = ">=3.10"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
